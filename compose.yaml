name: meguyomi

x-backend-core-env: &backend-core-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meguyomi:change-me@postgres:5432/meguyomi}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STORAGE_ROOT: /storage
  LOCAL_AI_URL: ${LOCAL_AI_URL:-http://local-ai:8001}
  LOCAL_AI_TIMEOUT_SECONDS: ${LOCAL_AI_TIMEOUT_SECONDS:-600}
  LOCAL_AI_MAX_IMAGE_BYTES: ${LOCAL_AI_MAX_IMAGE_BYTES:-16777216}
  LOCAL_AI_MAX_TILE_ASPECT_RATIO: ${LOCAL_AI_MAX_TILE_ASPECT_RATIO:-2.0}
  LOCAL_AI_TILE_OVERLAP_RATIO: ${LOCAL_AI_TILE_OVERLAP_RATIO:-0.2}
  PREPARATION_TIMEOUT_SECONDS: ${PREPARATION_TIMEOUT_SECONDS:-600}
  TRANSLATION_HEARTBEAT_TIMEOUT_SECONDS: ${TRANSLATION_HEARTBEAT_TIMEOUT_SECONDS:-300}
  TRANSLATION_QUEUE_RECOVERY_DELAY_SECONDS: ${TRANSLATION_QUEUE_RECOVERY_DELAY_SECONDS:-60}
  TRANSLATION_CHECKPOINT_RETENTION_DAYS: ${TRANSLATION_CHECKPOINT_RETENTION_DAYS:-7}
  TRANSLATION_QUALITY_RESCAN_ATTEMPTS: ${TRANSLATION_QUALITY_RESCAN_ATTEMPTS:-1}

x-backend-service: &backend-service
  build:
    context: ./backend
  volumes:
    - ./storage:/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: ${API_URL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend-service
    command: sh -c "alembic upgrade head && fastapi run app/main.py --port 8000"
    environment:
      <<: *backend-core-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-session-secret-change-me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend-service
    depends_on:
      api:
        condition: service_healthy
      local-ai:
        condition: service_healthy
    command: celery --app app.tasks.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      <<: *backend-core-env
      PREVIEW_RENDER_SCALE: ${PREVIEW_RENDER_SCALE:-2.0}

  maintenance:
    <<: *backend-service
    depends_on:
      api:
        condition: service_healthy
    command: celery --app app.tasks.celery_app worker --loglevel=INFO --concurrency=1 --queues=maintenance
    environment: *backend-core-env

  beat:
    <<: *backend-service
    depends_on:
      api:
        condition: service_healthy
    command: celery --app app.tasks.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment: *backend-core-env

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meguyomi}
      POSTGRES_USER: ${POSTGRES_USER:-meguyomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  local-ai:
    image: meguyomi-local-ai:latest
    build:
      context: ./local_ai
    environment:
      MODEL_ROOT: /models
      LOCAL_AI_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - local_ai_models:/models:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  model-setup:
    image: meguyomi-local-ai:latest
    build:
      context: ./local_ai
    profiles: [setup]
    command: python download_models.py
    environment:
      MODEL_ROOT: /models
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - local_ai_models:/models

volumes:
  postgres_data:
  redis_data:
  local_ai_models:
